name = "elasticemail-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret values. Set ELASTICEMAIL_API_KEY and ELASTICEMAIL_WEBHOOK_TOKEN with `wrangler secret put`.
# ELASTICEMAIL_WEBHOOK_SECRET (also `wrangler secret put`): signing secret returned once when the webhook
# is created with EnableSigning; leave it unset to use ELASTICEMAIL_WEBHOOK_TOKEN.
[vars]
EMAIL_FROM = "Acme <hello@yourdomain.com>"
